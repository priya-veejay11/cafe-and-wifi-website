<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Cafe - Cafe & Wifi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card shadow-sm p-4 my-5 mx-auto" style="max-width: 600px">
    <div class="mb-4 pb-2 border-bottom">
        <span class="badge bg-warning text-dark mb-2">New Listing</span>
        <h2 class="page-heading fw-bold mb-1">Add a New Cafe</h2>
        <p class="text-muted small mb-0">Share a great work-friendly spot with the community.</p>
    </div>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Cafe Name</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Google Maps URL</label>
            <input type="text" class="form-control" name="map_url" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text" class="form-control" name="img_url" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location / Neighborhood</label>
            <input type="text" class="form-control" name="location" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Seats e.g. 20-30</label>
            <input type="text" class="form-control" name="seats">
        </div>
        <div class="mb-3">
            <label class="form-label">Coffee Price e.g. $2.50</label>
            <input type="text" class="form-control" name="coffee_price">
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="has_wifi" id="wifi">
            <label class="form-check-label" for="wifi">Has WiFi</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="has_sockets" id="sockets">
            <label class="form-check-label" for="wifi">Has Sockets</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="has_toilet" id="toilet">
            <label class="form-check-label" for="wifi">Has Toilet</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="can_take_calls" id="calls">
            <label class="form-check-label" for="wifi">Can Take Calls</label>
        </div>
        <button type="submit" class="btn btn-dark mt-3">Save Cafe</button>
        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary mt-3 ms-2">Cancel</a>
    </form>
</div>

</body>
</html>
