<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit {{ cafe.name }} - Cafe & Wifi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card shadow-sm p-4 my-5 mx-auto" style="max-width: 600px">
    <div class="mb-4 pb-2 border-bottom">
        <span class="badge bg-dark mb-2">Editing Cafe</span>
        <h2 class="page-heading fw-bold mb-1">Edit <span class="text-primary">{{ cafe.name }}</span></h2>
        <p class="text-muted small mb-0">📍 {{ cafe.location }} — Update details or amenities below.</p>
    </div>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Cafe Name</label>
            <input type="text" class="form-control" name="name" value="{{ cafe.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Google Maps URL</label>
            <input type="text" class="form-control" name="map_url" value="{{ cafe.map_url }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text" class="form-control" name="img_url" value="{{ cafe.img_url }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location / Neighborhood</label>
            <input type="text" class="form-control" name="location" value="{{ cafe.location }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Seats e.g. 20-30</label>
            <input type="text" class="form-control" name="seats" value="{{ cafe.seats }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Coffee Price e.g. $2.50</label>
            <input type="text" class="form-control" name="coffee_price" value="{{ cafe.coffee_price }}">
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="has_wifi" id="wifi" {{ 'checked' if cafe.has_wifi else '' }}>
            <label class="form-check-label" for="wifi">Has WiFi</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="has_sockets" id="sockets" {{ 'checked' if cafe.has_sockets else '' }}>
            <label class="form-check-label" for="wifi">Has Sockets</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="has_toilet" id="toilet" {{ 'checked' if cafe.has_toilet else '' }}>
            <label class="form-check-label" for="wifi">Has Toilet</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="can_take_calls" id="calls" {{ 'checked' if cafe.can_take_calls else '' }}>
            <label class="form-check-label" for="wifi">Can Take Calls</label>
        </div>
        <button type="submit" class="btn btn-dark mt-3">Save Cafe</button>
        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary mt-3 ms-2">Cancel</a>
    </form>
</div>

</body>
</html>
